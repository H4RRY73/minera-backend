# Spring Application Name
spring.application.name=VentiStore Backend

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql:///mineria_db?cloudSqlInstance=feisty-bindery-433023-i6:us-central1:maintenance-bd&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false
spring.datasource.username=root
spring.datasource.password=610370
